name: Bug report
description: Something in sous behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Found the daemon reachable from off the loopback interface, a
        credential forwarded anywhere but `[server].upstream_url`, or a
        request body or header value in a log? Please close this and use
        [private reporting](https://github.com/krcm0209/sous/security/advisories/new)
        instead. See [SECURITY.md](https://github.com/krcm0209/sous/blob/main/SECURITY.md).

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I am on an Apple silicon Mac (sous does not run anywhere else)
          required: true
        - label: I searched existing issues
          required: true

  - type: input
    id: version
    attributes:
      label: Which version are you running?
      description: >-
        `uv tool list` shows it for a PyPI install; from a checkout, run
        `git rev-parse --short HEAD` in the checkout you installed from.
      placeholder: "0.7.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "15.5, M4 Pro, 48 GB"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: "`uv run python -V`"
      placeholder: "3.14.7"
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Model
      description: >-
        Which backend loads depends on this — a model with a `vision_config`
        runs through VLMEngine, everything else through LMEngine.
      options:
        - The default (mlx-community/Qwen3.8-27B-4bit)
        - A different MLX model
        - Not applicable — the bug does not involve the local model
    validations:
      required: true

  - type: input
    id: model_id
    attributes:
      label: Model id, if not the default
      placeholder: "mlx-community/Qwen3-0.6B-4bit"

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: >-
        What the subagent was asked, what you expected, and what sous did
        instead. Include the subagent's prompt if the local model misbehaved.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sous claude
        2. Ask Claude Code to run a subagent: "..."
        3. ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Daemon log excerpt (optional)
      description: >-
        Relevant lines from `~/.sous/daemon.log`: the `POST /v1/messages` line
        for the turn and anything at WARNING or above around it. The log
        carries no prompt text or tool input by design — if yours does, report
        that privately instead of here.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant config (optional)
      description: >-
        The parts of `~/.sous/config.toml` that matter — `[model]` for
        anything involving the local model, `[server]` for forwarding.
      render: toml
