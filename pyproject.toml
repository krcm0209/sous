[project]
# Distribution name only: the import package, CLI, and repo all stay `sous`.
# The bare name is squatted on PyPI (placeholder, untouched since 2022), so
# this uses the fallback the design spec reserved.
name = "sous-mcp"
version = "0.7.0"
description = "The sous-chef for Claude's kitchen: serve Claude Code's subagents from a local MLX model on Apple silicon, so heavy Claude Code use stretches further on the same plan"
readme = "README.md"
authors = [
    { name = "krcm0209", email = "17315774+krcm0209@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/Apache-2.0.txt"]
requires-python = ">=3.14"
keywords = [
    "claude",
    "claude-code",
    "subagent",
    "local-llm",
    "local-model",
    "mlx",
    "apple-silicon",
    "qwen",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    # server.serve imports anyio directly.
    "anyio>=4",
    # The endpoint's upstream forwarder (src/sous/api/upstream.py) imports
    # it directly.
    "httpx>=0.28",
    "huggingface-hub",
    # mlx >= 0.32.1 requires every thread that touched mlx to call
    # mx.clear_streams() before exiting (ml-explore/mlx#4327) — sous complies
    # via engine.base.release_mlx_thread_state, which is what allows mlx to
    # float here. A new mlx-touching thread that skips it segfaults the
    # daemon; see the helper's docstring.
    "mlx>=0.31",
    "mlx-lm>=0.31",
    # 0.7.0 is where generate_step re-applies a caller's position_ids/rope_deltas
    # over the embedding helper's; below it VLMEngine._positions is silently
    # overwritten and inert.
    "mlx-vlm>=0.7.0",
    "psutil>=7",
    # `sous top` (src/sous/tui.py) imports rich.text.Text directly. Textual
    # pulls rich in, but a direct import must be a direct dependency.
    "rich>=15",
    # The endpoint (src/sous/api) and server.serve import these directly.
    "sse-starlette>=3.4",
    "starlette>=1.6",
    # `sous top` only (src/sous/tui.py), imported inside that command
    # function: the daemon, the launcher and the status line never load it.
    # Pinned below the next major: Textual's CSS and widget APIs move between
    # majors, and the render snapshot in tests/snapshots pins one rendering.
    "textual>=8.2,<9",
    "tomlkit>=0.13",
    "uvicorn>=0.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling infers the package from the project name; explicitly set it.
packages = ["src/sous"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[project.scripts]
sous = "sous.cli:main"

[project.urls]
Repository = "https://github.com/krcm0209/sous"
Issues = "https://github.com/krcm0209/sous/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# An assertion inside a test's thread target is a warning by default, and a
# join that follows it passes; make it the failure it is.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
markers = [
    "model: needs a real MLX model downloaded (manual/local only)",
    "slow: takes several seconds of real wall-clock (runs a real server or spawns a real process)",
]

[tool.ruff]
line-length = 100
# target-version is inferred from project.requires-python
# docs/ holds the design spec and implementation plan: point-in-time records of
# what was decided, not live source. Ruff formats Python inside their fenced
# code blocks, which would rewrite history for no benefit.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# The suite's fixture projects import each other by bare name (`from rpn
# import evaluate`) and resolve only inside a copied project; the shipped
# graders prove them in CI instead.
exclude = ["src/sous/tune/suite/tasks"]
