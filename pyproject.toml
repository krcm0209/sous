[project]
name = "sous"
version = "0.1.0"
description = "The sous-chef for Claude's kitchen: an MCP daemon that delegates mechanical, volume-heavy coding tasks to a sandboxed local MLX worker on Apple silicon"
authors = [
    { name = "krcm0209", email = "17315774+krcm0209@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub",
    "mcp>=2.0,<3",
    "mlx-lm>=0.31",
    "mlx-vlm>=0.6.13",
    "tomlkit>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[project.scripts]
sous = "sous.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "model: needs a real MLX model downloaded (manual/local only)",
    "slow: takes several seconds of real wall-clock (process-group kill tests)",
]

[tool.ruff]
line-length = 100
# target-version is inferred from project.requires-python
# docs/ holds the design spec and implementation plan: point-in-time records of
# what was decided, not live source. Ruff formats Python inside their fenced
# code blocks, which would rewrite history for no benefit.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ty.environment]
python-version = "3.14"
