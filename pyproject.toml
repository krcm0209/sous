[project]
name = "sous"
version = "0.1.0"
description = "The sous-chef for Claude's kitchen: an MCP daemon that delegates mechanical, volume-heavy coding tasks to a sandboxed local MLX worker on Apple silicon"
authors = [
    { name = "krcm0209", email = "17315774+krcm0209@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub",
    "mcp>=2.0,<3",
    "mlx-lm>=0.31",
    "mlx-vlm>=0.6.13",
    "tomlkit>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
sous = "sous.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "model: needs a real MLX model downloaded (manual/local only)",
    "slow: takes several seconds of real wall-clock (process-group kill tests)",
]
