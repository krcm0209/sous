[project]
# Distribution name only: the import package, CLI, and repo all stay `sous`.
# The bare name is squatted on PyPI (placeholder, untouched since 2022), so
# this uses the fallback the design spec reserved.
name = "sous-mcp"
version = "0.4.0"
description = "The sous-chef for Claude's kitchen: an MCP daemon that delegates mechanical, volume-heavy coding tasks to a sandboxed local MLX worker on Apple silicon, so heavy Claude Code use stretches further on the same plan"
readme = "README.md"
authors = [
    { name = "krcm0209", email = "17315774+krcm0209@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = [
    "claude",
    "claude-code",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "local-llm",
    "mlx",
    "apple-silicon",
    "qwen",
    "ai-agents",
    "delegation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "huggingface-hub",
    "mcp>=2.0,<3",
    # mlx >= 0.32.1 requires every thread that touched mlx to call
    # mx.clear_streams() before exiting (ml-explore/mlx#4327) — sous complies
    # via engine.base.release_mlx_thread_state, which is what allows mlx to
    # float here. A new mlx-touching thread that skips it segfaults the
    # daemon; see the helper's docstring.
    "mlx>=0.31",
    "mlx-lm>=0.31",
    "mlx-vlm>=0.6.16",
    "psutil>=7",
    "tomlkit>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling infers the package from the project name, and sous-mcp != sous.
packages = ["src/sous"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[project.scripts]
sous = "sous.cli:main"
# `uvx sous-mcp` resolves the script matching the distribution name, which is
# how MCP clients launch registry packages — same CLI, second name.
sous-mcp = "sous.cli:main"

[project.urls]
Repository = "https://github.com/krcm0209/sous"
Issues = "https://github.com/krcm0209/sous/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "model: needs a real MLX model downloaded (manual/local only)",
    "slow: takes several seconds of real wall-clock (process-group kill tests)",
]

[tool.ruff]
line-length = 100
# target-version is inferred from project.requires-python
# docs/ holds the design spec and implementation plan: point-in-time records of
# what was decided, not live source. Ruff formats Python inside their fenced
# code blocks, which would rewrite history for no benefit.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ty.environment]
python-version = "3.14"
